<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAB • Atiyat Box Management</title>
  <meta name="description" content="Atiyat Box Management dashboard">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><i class="bi bi-box-seam"></i></div>
      <div><div class="brand-title">MAB</div><div class="brand-sub">Atiyat Box</div></div>
    </div>
    <div class="user-card">
      <div class="avatar">S</div>
      <div><strong>Supervisor</strong><small>Employee #13833</small></div>
      <i class="bi bi-three-dots ms-auto"></i>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <button class="nav-item" data-page="settings"><i class="bi bi-gear"></i><span>Settings</span></button>
      <button class="nav-item" data-page="help"><i class="bi bi-question-circle"></i><span>Help & FAQ</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn d-lg-none" id="menuBtn"><i class="bi bi-list"></i></button>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="breadcrumb-text">Management Atiyat Box / <span id="crumb">Dashboard</span></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" title="Notifications"><i class="bi bi-bell"></i><span class="notif-dot"></span></button>
        <button class="icon-btn" id="refreshBtn" title="Refresh data"><i class="bi bi-arrow-clockwise"></i></button>
        <div class="profile-pill"><span class="avatar sm">S</span><span>Supervisor</span><i class="bi bi-chevron-down"></i></div>
      </div>
    </header>

    <section class="content">
      <div id="app"></div>
    </section>
  </main>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
